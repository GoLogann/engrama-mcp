services:
  neo4j:
    image: neo4j:5.26-community
    container_name: engrama-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?defina NEO4J_PASSWORD no .env}
    volumes:
      - neo4j-data:/data

volumes:
  neo4j-data:
