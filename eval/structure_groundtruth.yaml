# Referencia do Portao 1: rotas expostas e chamadas HTTP entre os repos,
# levantadas e conferidas a mao nos commits de config/repos.yaml (27/10/2026).
#
# Rotas na forma canonica (docs/ontologia.md): parametros como {nome}, sem
# query string. `line` e a linha do decorator (FastAPI), do registro da rota
# (Gin) ou da chamada que monta a URL (React, Flutter).
#
# Fora do escopo: rotas que o framework cria sozinho (/docs, /openapi.json).

