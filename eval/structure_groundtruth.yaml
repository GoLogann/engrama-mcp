# Quem consome quem. Nao sai do codigo de forma deterministica (a base URL vem
# de variavel de ambiente), entao vira configuracao em config/repos.yaml na
# fase 1. Importa porque `GET /api/v1/cues` existe nas duas APIs.
consumes:
  phishforge-frontend: [phishforge-api]   # VITE_API_BASE_URL, padrao localhost:8000
  phishing_quest: [phishing-quest-api]    # environments.dart, .../api/v1

calls:
  phishforge-frontend:  # 27 chamadas, todas para a phishforge-api
    src/services/apiService.ts:
      - {line: 15, route: "POST /api/v1/generate"}
      - {line: 20, route: "POST /api/v1/generate/batch"}
      - {line: 24, route: "GET /api/v1/generate/batch/{jobId}"}
      - {line: 29, route: "GET /api/v1/emails/{emailId}"}
      - {line: 43, route: "GET /api/v1/emails"}
      - {line: 48, route: "GET /api/v1/emails/statistics"}
      - {line: 53, route: "DELETE /api/v1/emails/{emailId}"}
    src/services/expertApiService.ts:
      - {line: 17, route: "POST /api/v1/expert/session"}
      - {line: 25, route: "GET /api/v1/expert/me"}
      - {line: 29, route: "GET /api/v1/expert/tcle"}
      - {line: 33, route: "POST /api/v1/expert/consentimento"}
      - {line: 41, route: "POST /api/v1/expert/perfil"}
      - {line: 45, route: "GET /api/v1/expert/cues"}
      - {line: 49, route: "GET /api/v1/expert/itens/{ordem}"}
      - {line: 53, route: "PUT /api/v1/expert/itens/{ordem}"}
    src/services/researcherApiService.ts:  # const P = '/api/v1/researcher', linha 18
      - {line: 20, route: "GET /api/v1/researcher/rodadas"}
      - {line: 23, route: "GET /api/v1/researcher/rodadas/{id}"}
      - {line: 36, route: "GET /api/v1/researcher/corpus"}
      - {line: 40, route: "POST /api/v1/researcher/rodadas"}
      - {line: 43, route: "PUT /api/v1/researcher/rodadas/{id}/itens"}
      - {line: 46, route: "POST /api/v1/researcher/rodadas/{id}/abrir"}
      - {line: 49, route: "POST /api/v1/researcher/rodadas/{id}/encerrar"}
      - {line: 52, route: "POST /api/v1/researcher/especialistas"}
      - {line: 55, route: "POST /api/v1/researcher/especialistas/{id}/recodificar"}
      - {line: 58, route: "GET /api/v1/researcher/especialistas"}
      - {line: 61, route: "GET /api/v1/researcher/rodadas/{id}/resumo"}
      - {line: 72, route: "GET /api/v1/researcher/rodadas/{id}/export"}

  phishing_quest:  # 6 chamadas, todas para a phishing-quest-api; base termina em /api/v1
    lib/app/data/repositories/category/category_repository.dart:
      - {line: 15, route: "GET /api/v1/categories"}
    lib/app/data/repositories/question/question_repository.dart:
      - {line: 17, route: "GET /api/v1/categories/{categoryId}/questions"}
      - {line: 33, route: "GET /api/v1/questions/{questionId}/answers"}
    lib/app/data/repositories/game/game_repository.dart:
      - {line: 21, route: "POST /api/v1/game/answer"}
    lib/app/data/repositories/register/register_repository.dart:  # path na constante da linha 5
      - {line: 12, route: "POST /api/v1/users/register"}
    lib/app/data/repositories/login/login_repository.dart:  # path na constante da linha 5
      - {line: 12, route: "POST /api/v1/users/login"}

# Bancos que cada repo declara no compose da raiz. No Qdrant, o nome e a colecao
# do `COLLECTION_NAME` do codigo, nao o nome do servico. Os outros dois repos
# (phishforge-frontend e phishing_quest) nao tem compose nem banco.
# O servico `phishforge-export` usa a imagem do Postgres so como cliente (pg_dump),
# sem POSTGRES_DB, e por isso nao conta como banco.
datastores:
  - {repo: phishforge-api, kind: postgres, name: phishforge}  # docker-compose.yml:2 (POSTGRES_DB, linha 7)
  - {repo: phishforge-api, kind: qdrant, name: phishing_articles}  # docker-compose.yml:26 + app/core/config.py:19
  - {repo: phishing-quest-api, kind: postgres, name: phishing_quest}  # docker-compose.yml:3 (POSTGRES_DB, linha 7)

# O que o grafo precisa revelar a partir das listas acima.
expected_findings:
  every_call_matches_an_endpoint: true   # as 33 chamadas casam com uma rota
  endpoints_without_client:
    phishforge-api:
      - GET /api/v1/cues
      - POST /api/v1/evaluate/user-answer
      - POST /api/v1/expert/revogacao
    phishing-quest-api:
      count: 39   # 45 rotas - 6 usadas pelo app; inclui GET /api/v1/rankings
  documented_only_integrations:
    - from: phishing-quest-api
      to: phishforge-api
      evidence:
        - phishforge-api/docs/integracao_api.md:37    # "o unico cliente legitimo hoje e o backend Go"
        - phishforge-api/docs/integracao_api.md:143   # integracao via phishing-quest-api #62, que ainda nao existe
        - phishforge-api/app/api/router.py:11         # require_api_key pensado para o backend Go
      code: nenhuma chamada HTTP de saida no Go (busca por http.Get/Post/NewRequest e por /api/v1/generate)
  unused_features:
    - endpoint: phishing-quest-api:GET /api/v1/rankings
      evidence: phishing_quest/lib/app/modules/ranking/ranking_controller.dart:28   # MockData.ranking
