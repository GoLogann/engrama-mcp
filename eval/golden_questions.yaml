    fontes:
      - phishing-quest-api/core/service/item_draft_service.go:32
      - phishing-quest-api/core/service/item_draft_service.go:67

  - id: t20
    publico: tecnico
    camada: experiencia
    pergunta: Qual é a estratégia de testes de integração e CI da Quest API?
    deve_conter:
      - workflow novo de CI em PR, sem mexer no existente
      - testes atrás da build tag integration, subindo o app real
      - migrations aplicadas pelo Flyway no CI e dados de referência preservados entre testes
    fontes: [phishing-quest-api/docs/decisoes/0002-estrategia-testes-e-ci.md:20]
